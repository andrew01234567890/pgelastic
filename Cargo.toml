[workspace]
resolver = "3"
members = [
    "crates/pgelastic-wire",
    "crates/pgelastic-pool",
    "crates/pgelastic-capacity",
    "crates/pgelastic-proxy",
    "crates/pgelastic-admin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/andrew01234567890/pgelastic"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
