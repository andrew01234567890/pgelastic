name: E2E Tests

# What runs where, and why.
#
# Every push to main and every PR runs `make test-e2e`, which is everything the Makefile
# chains behind that target - the kubebuilder scaffold specs and each suite that stands up
# real PostgreSQL 18 Pods and asserts on what PostgreSQL reports - minus the chaos specs.
# That is the cheapest honest evidence that a change has not broken provisioning.
#
# The chaos specs are excluded there and run nightly instead. They cordon every node,
# force-delete the primary with no grace period and drive a durability oracle for ~9
# minutes; on a shared runner that is both the slowest part and the part most likely to
# flake on timing, and a red build people learn to re-run is worth less than a nightly one
# they read. workflow_dispatch takes a `chaos` input so the nightly job can be demanded on
# a branch before merging anything that touches failover.
#
# The rolling-restart suite runs there too, for the same reason and one more: it recreates
# every member Pod of a real instance and switches the primary away, so it costs several
# minutes of real restarts that a per-push job cannot absorb.
#
# The split is a Ginkgo label, not a spec-name regex: the chaos Describe carries
# Label("chaos"), so a new chaos spec is nightly by construction rather than by remembering
# to update a pattern here.
on:
  # Restricted to main on push because an unrestricted push trigger runs every PR branch
  # twice; PRs still get the full job through pull_request.
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      chaos:
        description: "Also run the chaos specs on this ref"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KIND_VERSION: v0.32.0

jobs:
  provisioning:
    # A scheduled run belongs to the chaos job, which runs these specs too; running both
    # would build the images twice for a strict subset of the same assertions.
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    name: kind e2e without chaos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Download modules
        run: go mod download

      # make test-e2e creates the kind cluster, runs the scaffold specs against it, then
      # hands that same cluster to the suites it chains as E2E_CONTEXT=kind-<cluster>.
      # Those targets build both images and kind-load them themselves.
      - name: Run e2e without the chaos specs
        run: make test-e2e E2E_LABEL_FILTER='!chaos' E2E_HEAVY=false

  chaos:
    if: github.event_name == 'schedule' || inputs.chaos
    permissions:
      contents: read
    name: instance chaos
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KIND_CLUSTER: pgelastic-chaos
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Download modules
        run: go mod download

      - name: Create the kind cluster
        run: make setup-test-e2e

      # No label filter, so this is the whole instance suite - provisioning specs included.
      # Re-running them here costs a couple of minutes and means a chaos failure can be read
      # against a run where the uneventful path was proven on the same cluster.
      - name: Run the full instance suite
        run: make test-e2e-instance E2E_CONTEXT="kind-${KIND_CLUSTER}"

      # Migration drives two full three-node instances through logical replication, which
      # does not fit the per-push budget on a two-core runner. It belongs here rather than
      # nowhere: the alternative was a longer timeout on the per-push job, which would only
      # have made the slow path flakier without covering it any better.
      - name: Run the migration suite
        run: make test-e2e-migration E2E_CONTEXT="kind-${KIND_CLUSTER}"

      # The proxy suite is the only place a client reaches a tenant's database the way a
      # real one does: through the pool's Service. It stands up two three-node instances and
      # a fleet in front of them, so it costs what the migration suite costs and belongs in
      # the same job.
      - name: Run the proxy suite
        run: make test-e2e-proxy E2E_CONTEXT="kind-${KIND_CLUSTER}"

      # The backup suite is the only place the claim "WAL reached the object store" is
      # answered by fetching a segment back out of one. It stands up an S3-compatible store
      # with a certificate it signs itself, so it needs egress for that image and a real
      # three-node instance to archive from, which is why it is here rather than per-push.
      - name: Run the backup suite
        run: make test-e2e-backup E2E_CONTEXT="kind-${KIND_CLUSTER}"

      # The restart suite recreates every member Pod of a real instance and switches the
      # primary away under a client that never disconnects. It drives real restarts, so it
      # belongs with the chaos and migration specs rather than on the per-push job. The
      # drain-trap spec is excluded by its own label: kind here is one node, and a
      # switchover away from a node that is going away needs somewhere for the role to go.
      - name: Run the restart suite
        run: make test-e2e-restart E2E_CONTEXT="kind-${KIND_CLUSTER}"

      - name: Tear down the kind cluster
        if: always()
        run: make cleanup-test-e2e
