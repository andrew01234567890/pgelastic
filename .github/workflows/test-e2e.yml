name: E2E Tests

# What runs where, and why.
#
# Every push to main and every PR runs `make test-e2e`, which is everything the Makefile
# chains behind that target - the kubebuilder scaffold specs and each suite that stands up
# real PostgreSQL 18 Pods and asserts on what PostgreSQL reports - minus the chaos specs.
# That is the cheapest honest evidence that a change has not broken provisioning.
#
# The chaos specs are excluded there and run nightly instead. They cordon every node,
# force-delete the primary with no grace period and drive a durability oracle for ~9
# minutes; on a shared runner that is both the slowest part and the part most likely to
# flake on timing, and a red build people learn to re-run is worth less than a nightly one
# they read. workflow_dispatch takes a `chaos` input so the nightly job can be demanded on
# a branch before merging anything that touches failover.
#
# The rolling-restart suite runs there too, for the same reason and one more: it recreates
# every member Pod of a real instance and switches the primary away, so it costs several
# minutes of real restarts that a per-push job cannot absorb.
#
# The backup suite gets a PR-blocking job of its own. It was nightly-only until 2026-08-01,
# on the reasoning that it needs egress for an object-store image - and in that time it never
# ran once, because the nightly was failing on an earlier suite and nothing downstream of the
# failure was reached. Four merged PRs of backup and PITR work were proven by nothing at all.
# Its prerequisites are the cheapest of any suite here: instance images and CRDs, no
# cert-manager and no Rust proxy build, so an hour of its own is what it costs to know.
#
# The split between per-PR and nightly is a Ginkgo label rather than a spec-name regex: the
# chaos Describe carries Label("chaos"), so a new chaos spec is nightly by construction
# rather than by remembering to update a pattern here. Which whole suites are gated where is
# not expressible that way, so internal/hygiene/e2e_gate_test.go asserts it instead.
on:
  # Restricted to main on push because an unrestricted push trigger runs every PR branch
  # twice; PRs still get the full job through pull_request.
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      chaos:
        description: "Also run the chaos specs on this ref"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KIND_VERSION: v0.32.0

jobs:
  provisioning:
    # A scheduled run belongs to the chaos job, which runs these specs too; running both
    # would build the images twice for a strict subset of the same assertions.
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    name: kind e2e without chaos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Download modules
        run: go mod download

      # make test-e2e creates the kind cluster, runs the scaffold specs against it, then
      # hands that same cluster to the suites it chains as E2E_CONTEXT=kind-<cluster>.
      # Those targets build both images and kind-load them themselves.
      - name: Run e2e without the chaos specs
        run: make test-e2e E2E_LABEL_FILTER='!chaos' E2E_HEAVY=false

  # Its own job rather than another step on provisioning, so it gets its own hour and its own
  # cluster, and so a slow day turns into a slow build rather than a timeout on a job that is
  # already carrying two suites.
  backup:
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    name: backup and PITR e2e
    runs-on: ubuntu-latest
    # Ninety rather than sixty. The suite provisions three real three-node instances in
    # sequence - the archive source, an instance recovered to a point in time, and the
    # throwaway a tenant restore recovers into - plus an object store. On the two cores a
    # hosted runner gives, that is comfortably over an hour's work, and a job that times out
    # tells you nothing at all about what it was testing.
    timeout-minutes: 90
    env:
      KIND_CLUSTER: pgelastic-backup
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Download modules
        run: go mod download

      - name: Create the kind cluster
        run: make setup-test-e2e

      - name: Run the backup suite
        run: make test-e2e-backup E2E_CONTEXT="kind-${KIND_CLUSTER}"

      - name: Tear down the kind cluster
        if: always()
        run: make cleanup-test-e2e

  # Placement and tenant provisioning are two label halves of one suite directory. Neither
  # ran in any job at all until 2026-08-01 - not per-PR, not nightly - which is the same
  # condition the backup suite was in when four PRs merged against it unproven. Placement
  # stands up no PostgreSQL and tenantdb stands up one instance, so together they are the
  # cheapest suite pair here after backup.
  placement:
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    name: placement and tenant databases e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KIND_CLUSTER: pgelastic-placement
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Download modules
        run: go mod download

      - name: Create the kind cluster
        run: make setup-test-e2e

      - name: Run the placement suite
        run: make test-e2e-placement E2E_CONTEXT="kind-${KIND_CLUSTER}"

      - name: Run the tenant database suite
        run: make test-e2e-tenantdb E2E_CONTEXT="kind-${KIND_CLUSTER}"

      - name: Tear down the kind cluster
        if: always()
        run: make cleanup-test-e2e

  # The proxy suite is the only gate on the connection proxy, which is the component that
  # changes most and the one every client byte crosses. It used to run only in the nightly
  # chaos job, so a whole milestone of relay work - deadlines, pinning, the idle reaper, the
  # pool key - merged without it ever executing, and it was red for two days before anyone
  # looked: on a push the chaos job's `if:` is false, so the run went green with the job
  # reported as skipped. It runs in its own job rather than on the back of `make test-e2e`
  # because the jobs run concurrently: the gate learns about the proxy without anything else
  # waiting for it.
  proxy:
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    name: proxy e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KIND_CLUSTER: pgelastic-proxy
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Download modules
        run: go mod download

      - name: Create the kind cluster
        run: make setup-test-e2e

      - name: Run the proxy suite
        run: make test-e2e-proxy E2E_CONTEXT="kind-${KIND_CLUSTER}"

      - name: Tear down the kind cluster
        if: always()
        run: make cleanup-test-e2e

  chaos:
    if: github.event_name == 'schedule' || inputs.chaos
    permissions:
      contents: read
    name: instance chaos
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KIND_CLUSTER: pgelastic-chaos
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Download modules
        run: go mod download

      - name: Create the kind cluster
        run: make setup-test-e2e

      # Every suite below carries `if: !cancelled()`, so one red suite reports its own failure
      # instead of hiding the three behind it. Without it this job was fail-fast over five
      # suites in sequence: a red migration suite on 07-29 and 07-30 meant nothing was known
      # about proxy, backup or restart on either night, and the job simply said "failure".
      # The job still fails if any suite does; what changes is how much is learned per run.

      # No label filter, so this is the whole instance suite - provisioning specs included.
      # Re-running them here costs a couple of minutes and means a chaos failure can be read
      # against a run where the uneventful path was proven on the same cluster.
      - name: Run the full instance suite
        if: ${{ !cancelled() }}
        run: make test-e2e-instance E2E_CONTEXT="kind-${KIND_CLUSTER}"

      # Migration drives two full three-node instances through logical replication, which
      # does not fit the per-push budget on a two-core runner. It belongs here rather than
      # nowhere: the alternative was a longer timeout on the per-push job, which would only
      # have made the slow path flakier without covering it any better.
      - name: Run the migration suite
        if: ${{ !cancelled() }}
        run: make test-e2e-migration E2E_CONTEXT="kind-${KIND_CLUSTER}"

      # The proxy suite is the only place a client reaches a tenant's database the way a
      # real one does: through the pool's Service. It stands up two three-node instances and
      # a fleet in front of them, so it costs what the migration suite costs and belongs in
      # the same job.
      - name: Run the proxy suite
        if: ${{ !cancelled() }}
        run: make test-e2e-proxy E2E_CONTEXT="kind-${KIND_CLUSTER}"

      # The restart suite recreates every member Pod of a real instance and switches the
      # primary away under a client that never disconnects. It drives real restarts, so it
      # belongs with the chaos and migration specs rather than on the per-push job. The
      # drain-trap spec is excluded by its own label: kind here is one node, and a
      # switchover away from a node that is going away needs somewhere for the role to go.
      - name: Run the restart suite
        if: ${{ !cancelled() }}
        run: make test-e2e-restart E2E_CONTEXT="kind-${KIND_CLUSTER}"

      - name: Tear down the kind cluster
        if: always()
        run: make cleanup-test-e2e
