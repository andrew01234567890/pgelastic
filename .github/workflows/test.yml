name: Tests

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # download, not tidy: `go mod tidy` rewrites go.mod inside the job, so a go.mod that
      # is missing a requirement is repaired on the runner and the build stays green while
      # nobody else can reproduce it.
      - name: Download modules
        run: go mod download

      # Three tests start a real PostgreSQL through testcontainers, and testcontainers pulls
      # the image inside the test with a deadline it does not retry. A Docker Hub that is slow
      # for fifteen seconds therefore reds the build with "context deadline exceeded" from a
      # test that has nothing to do with the change. Pulling first, with retries, moves that
      # failure to a step whose only job is the pull - and usually removes it.
      - name: Pull the PostgreSQL image the container tests use
        run: |
          for attempt in 1 2 3; do
            docker pull postgres:18 && exit 0
            echo "pull attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "could not pull postgres:18 after three attempts"
          exit 1

      - name: Running Tests
        run: make test
