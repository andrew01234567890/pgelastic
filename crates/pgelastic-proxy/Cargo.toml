[package]
name = "pgelastic-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arc-swap = "1.9.2"
aws-lc-rs = "1.17.3"
base64 = "0.23.0"
bytes = "1.12.1"
clap = { version = "4.6.4", features = ["derive"] }
futures-util = "0.3.33"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "http1"] }
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "runtime", "rustls-tls", "aws-lc-rs"] }
pgelastic-capacity = { version = "0.1.0", path = "../pgelastic-capacity" }
pgelastic-pool = { version = "0.1.0", path = "../pgelastic-pool" }
pgelastic-wire = { version = "0.1.0", path = "../pgelastic-wire" }
rustls = { version = "0.23.42", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.1"
rustls-webpki = { version = "0.103.13", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
stringprep = "0.1.5"
subtle = "2.6.1"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3.33"
rcgen = "0.14.8"
tempfile = "3.27.0"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
