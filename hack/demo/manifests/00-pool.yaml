apiVersion: pgelastic.io/v1alpha1
kind: PgElasticClass
metadata:
  name: demo-class
spec:
  controllerName: pgelastic.io/pool-controller
  tier: GeneralPurpose
  tenancyModel: SharedInstance
  admittedNamespaces:
    from: All
---
apiVersion: pgelastic.io/v1alpha1
kind: PgWorkloadClass
metadata:
  name: demo-standard
spec:
  priority: 1000
  global: true
  capacity:
    guaranteed: 2
    burstable: 20
    weight: 100
    maxClientConnections: 100
---
apiVersion: pgelastic.io/v1alpha1
kind: PgElasticPool
metadata:
  name: demo-pool
spec:
  classRef:
    kind: PgElasticClass
    name: demo-class
  capacity:
    backendConnections: 100
    headroomPercent: 25
  admission:
    defaultWorkloadClassName: demo-standard
    allowedWorkloadClassNames: [demo-standard]
  pooling:
    mode: Transaction
  # The fleet is what the demo is about. A tenant can only be moved with its clients queued
  # rather than dropped if something is holding their sockets, and that something is here.
  #
  # Two replicas, because the gate is per-replica in-memory state and kube-proxy pins a
  # connection to one endpoint for its life: a cutover that quiesced one replica would leave
  # the other's clients running against the instance it was abandoning.
  proxy:
    replicas: 2
    workers: 2
    routing:
      tenantDiscriminators: [DatabaseName]
    resources:
      requests:
        cpu: 100m
        memory: 96Mi
  instances:
    replicas: 2
    template:
      class: dev-1
      storage:
        size: 2Gi
        walVolume:
          size: 1Gi
