; pgbouncer as the external reference arm.
;
; Rust versus Go on its own is a closed comparison: it says which of the two is faster, not
; whether either is any good. pgbouncer is the answer most people already have, so it anchors
; both arms in absolute terms.
;
; Every setting here is matched term-for-term to txn-fence-off.toml, because the point of the
; arm is lost if the two are pooling differently. What cannot be matched is the work itself:
; pgbouncer has no epoch fence, no tenant routing, no capacity allocator, no quiesce and no
; per-tenant backend credentials. It is doing less, and the report says so beside the number
; rather than presenting the number alone.

[databases]
bench = host=pgebench-pg port=5432 dbname=bench

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Matched to [pool] in txn-fence-off.toml.
pool_mode = transaction
default_pool_size = 100
max_client_conn = 5000

; Left at pgbouncer's own default, which is the honest thing and also a trap worth naming.
; server_reset_query_always defaults to 0, so in transaction mode this query is NEVER RUN -
; pgbouncer makes one backend round trip per client transaction. Our resetPolicy =
; "discardAll" issues a DISCARD ALL on every release, so the shipped proxy makes two.
;
; Comparing those two directly would be comparing one round trip against two and reporting
; the gap as an implementation difference. That is what the rust-reset-none arm exists for:
; it is the row that matches this configuration term for term.
server_reset_query = DISCARD ALL
server_reset_query_always = 0

; Matched to [auth]: SCRAM on the client leg, no TLS on either leg.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
client_tls_sslmode = disable
server_tls_sslmode = disable

; The reference arm is a data-plane measurement, so keep logging off the hot path for the
; same reason the Rust arm runs at RUST_LOG=warn.
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; pgbouncer is single-threaded by design. Left at one process deliberately, and reported as
; such: the comparison rows state the core count each arm actually used rather than implying
; they were equal.
so_reuseport = 0

ignore_startup_parameters = extra_float_digits,options
