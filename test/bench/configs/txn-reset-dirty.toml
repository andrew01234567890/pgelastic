# Transaction pooling, epoch fence off, reset only when the link is actually dirty.
#
# The real like-for-like row against pgbouncer.
#
# resetPolicy = "none" is NOT the equivalent of pgbouncer skipping its reset query. With that
# policy a link carrying any taint is closed rather than reused (ResetDisposition::Close,
# CloseReason::ResetDisabled), so throughput collapses to the rate backends can be opened -
# measured here at ~170/s against ~12,000/s for discardAll. dirtyTracked reuses a clean link
# with no reset at all, which for a SELECT workload is one backend round trip, exactly what
# pgbouncer does in transaction mode.
configVersion = "bench-txn-reset-dirty"

[listen]
address = "0.0.0.0:6432"
maxClientConnections = 5000
clientLoginSeconds = 10

[backend]
address = "pgebench-pg:5432"
user = "bench"
password = "bench"
database = "bench"
connectSeconds = 5

[backend.tls]
mode = "Disable"

[auth]
scramIterations = 4096
kdfConcurrency = 4

[[auth.users]]
name = "bench"
password = "bench"

[pool]
mode = "transaction"
backendConnections = 100
headroomPercent = 0
maxClientConnections = 5000
resetPolicy = "dirtyTracked"
queryWaitSeconds = 30
notifyAfterSeconds = 5
queueDepthPerTenant = 512
maxServerStatements = 64
serverLifetimeSeconds = 3600

[limits]
inlineFrameBytes = 65536

[fence]
verifyAtCheckout = false

[stall]
enabled = false

[metrics]
address = "0.0.0.0:9127"

[drain]
shutdownSeconds = 5
