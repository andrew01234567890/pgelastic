# This rule is not used by the project pgelastic itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the pgelastic.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: pgelastic
    app.kubernetes.io/managed-by: kustomize
  name: pgelasticpool-editor-role
rules:
- apiGroups:
  - pgelastic.io
  resources:
  - pgelasticpools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - pgelastic.io
  resources:
  - pgelasticpools/status
  verbs:
  - get
