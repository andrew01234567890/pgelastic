---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: pgelasticpools.pgelastic.io
spec:
  group: pgelastic.io
  names:
    categories:
    - pgelastic
    kind: PgElasticPool
    listKind: PgElasticPoolList
    plural: pgelasticpools
    shortNames:
    - pgpool
    singular: pgelasticpool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.capacity.backendConnections
      name: Capacity
      type: integer
    - jsonPath: .status.capacity.allocatable
      name: Allocatable
      type: integer
    - jsonPath: .status.capacity.reserved
      name: Reserved
      type: integer
    - jsonPath: .status.capacity.available
      name: Available
      type: integer
    - jsonPath: .status.capacity.inUse
      name: InUse
      type: integer
    - jsonPath: .status.tenants.total
      name: Tenants
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PgElasticPool is the resource boundary: one capacity budget, one reservation ledger and
          one proxy fleet, shared by many tenant databases across several PostgreSQL instances.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PgElasticPool
            properties:
              admission:
                description: admission governs which tenants bind and how contended
                  capacity is handed out.
                properties:
                  admittedNamespaces:
                    description: |-
                      admittedNamespaces is the pool side of a bidirectional consent: the class must admit
                      the namespace and so must the pool. One-way selection, where a tenant simply names a
                      pool, is a tenancy escape.
                    properties:
                      from:
                        default: Same
                        description: from selects the namespace-matching strategy.
                        enum:
                        - All
                        - Selector
                        - Same
                        type: string
                      selector:
                        description: selector matches namespaces by label. Only consulted
                          when from is Selector.
                        properties:
                          matchExpressions:
                            description: matchExpressions is a list of label selector
                              requirements. The requirements are ANDed.
                            items:
                              description: |-
                                A label selector requirement is a selector that contains values, a key, and an operator that
                                relates the key and values.
                              properties:
                                key:
                                  description: key is the label key that the selector
                                    applies to.
                                  type: string
                                operator:
                                  description: |-
                                    operator represents a key's relationship to a set of values.
                                    Valid operators are In, NotIn, Exists and DoesNotExist.
                                  type: string
                                values:
                                  description: |-
                                    values is an array of string values. If the operator is In or NotIn,
                                    the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                    the values array must be empty. This array is replaced during a strategic
                                    merge patch.
                                  items:
                                    type: string
                                  type: array
                                  x-kubernetes-list-type: atomic
                              required:
                              - key
                              - operator
                              type: object
                            type: array
                            x-kubernetes-list-type: atomic
                          matchLabels:
                            additionalProperties:
                              type: string
                            description: |-
                              matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                              map is equivalent to an element of matchExpressions, whose key field is "key", the
                              operator is "In", and the values array contains only "value". The requirements are ANDed.
                            type: object
                        type: object
                        x-kubernetes-map-type: atomic
                    type: object
                  allowedWorkloadClassNames:
                    description: |-
                      allowedWorkloadClassNames restricts which classes tenants in this pool may claim. An
                      empty list allows every class the pool's PgElasticClass permits.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: atomic
                  breakGlassRole:
                    description: |-
                      breakGlassRole names a PostgreSQL role granted one reserved connection that bypasses
                      every admission gate, so an operator can still reach a pool that is refusing everyone.
                    maxLength: 63
                    type: string
                  defaultWorkloadClassName:
                    description: defaultWorkloadClassName is applied to tenants that
                      name no class.
                    maxLength: 253
                    type: string
                  maxWaitSeconds:
                    default: 30
                    description: maxWaitSeconds bounds how long a client waits for
                      a backend before it is denied.
                    format: int32
                    maximum: 3600
                    minimum: 0
                    type: integer
                  quarantine:
                    description: |-
                      quarantine holds newly admitted tenants in a restricted class until their workload has
                      been observed, so an uncharacterised tenant cannot destabilise the pool on day one.
                    properties:
                      autoPromote:
                        default: false
                        description: autoPromote graduates a tenant without human
                          approval once the window closes.
                        type: boolean
                      enabled:
                        default: true
                        description: enabled turns quarantine on for newly bound tenants.
                        type: boolean
                      observationWindow:
                        default: 168h
                        description: |-
                          observationWindow is how long a tenant's utilization is sampled before promotion is
                          considered.
                        type: string
                      promotionPercentile:
                        default: P95
                        description: |-
                          promotionPercentile is the statistic of the observed window that the promoted class's
                          capacity must cover.
                        enum:
                        - P50
                        - P75
                        - P90
                        - P95
                        - P99
                        type: string
                      promotionWorkloadClassName:
                        description: promotionWorkloadClassName is the class a tenant
                          graduates into.
                        maxLength: 253
                        type: string
                    type: object
                  queryWaitNotifySeconds:
                    default: 5
                    description: |-
                      queryWaitNotifySeconds is when a still-waiting client receives a NoticeResponse, so a
                      slow connect is diagnosable from the client side rather than only from pool metrics.
                    format: int32
                    maximum: 3600
                    minimum: 0
                    type: integer
                  queueDepthPerTenant:
                    default: 64
                    description: |-
                      queueDepthPerTenant caps queued clients per tenant. Bounding it per tenant rather than
                      per pool stops one tenant's retry storm from evicting every other tenant's waiters.
                    format: int32
                    maximum: 10000
                    minimum: 0
                    type: integer
                  reservationMode:
                    default: Strict
                    description: reservationMode selects whether idle guaranteed credits
                      are lendable.
                    enum:
                    - Strict
                    - Elastic
                    type: string
                  strategy:
                    default: WeightedDeficit
                    description: strategy orders waiting clients when the budget is
                      exhausted.
                    enum:
                    - WeightedDeficit
                    - Fifo
                    type: string
                type: object
              auth:
                description: auth configures client and backend authentication.
                properties:
                  mode:
                    default: ScramPassthrough
                    description: mode selects the authentication chain.
                    enum:
                    - ScramPassthrough
                    - BackendServiceAccount
                    - AuthQuery
                    type: string
                  rotation:
                    description: rotation schedules credential rotation.
                    properties:
                      overlapWindow:
                        default: 24h
                        description: overlapWindow is how long the previous verifier
                          stays accepted after a rotation.
                        type: string
                      schedule:
                        description: schedule is a five-field cron expression.
                        maxLength: 256
                        type: string
                    type: object
                  scramIterations:
                    default: 4096
                    description: |-
                      scramIterations is the PBKDF2 iteration count used when provisioning verifiers. Under
                      ScramPassthrough the proxy must reproduce the backend verifier byte for byte, so this
                      value is part of the credential, not a tunable.
                    format: int32
                    maximum: 1000000
                    minimum: 4096
                    type: integer
                type: object
              autoscaling:
                description: autoscaling configures the capacity planner.
                properties:
                  autoActions:
                    description: |-
                      autoActions is the set of change classes the planner may execute in Auto mode.
                      Everything not listed is planned and reported but never applied, so the list is opted
                      into one class at a time. Within one planning pass at most one class is executed, and
                      the classes are considered in the order they are declared on AutoAction: cheapest and
                      most reversible first, scale-in last.
                    items:
                      description: |-
                        AutoAction is one class of change the autoscaler may execute without human approval.
                        They are listed in the order they are meant to be opted into: earlier entries are
                        cheaper and more reversible than later ones.
                      enum:
                      - TenantGucTune
                      - StorageExpand
                      - ScaleOut
                      - Rebalance
                      - VerticalResize
                      - ScaleIn
                      type: string
                    maxItems: 6
                    type: array
                    x-kubernetes-list-type: atomic
                  blackoutWindows:
                    description: |-
                      blackoutWindows suspend every executed action, not only rebalancing. A pool that must
                      not be touched during a change freeze must not be resized during it either.
                    items:
                      description: TimeWindow is a recurring window expressed as a
                        cron start plus a duration.
                      properties:
                        duration:
                          description: duration is how long the window stays open
                            once started.
                          type: string
                        schedule:
                          description: schedule is a standard five-field cron expression
                            giving the window start.
                          maxLength: 256
                          type: string
                        timeZone:
                          default: UTC
                          description: timeZone is an IANA zone name. Defaults to
                            UTC.
                          maxLength: 64
                          type: string
                      required:
                      - duration
                      - schedule
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: atomic
                  consolidationDwellTime:
                    default: 24h
                    description: |-
                      consolidationDwellTime is how long an instance must have been consolidatable before
                      scale-in will act on it. It is separate from the scale-down stabilization window: the
                      window says the surplus has persisted, the dwell time says the decision to reclaim a
                      specific instance has persisted.
                    type: string
                  maxInstances:
                    description: maxInstances is the ceiling on pool member count.
                    format: int32
                    maximum: 64
                    minimum: 1
                    type: integer
                  migrationBudget:
                    description: migrationBudget bounds how much tenant movement the
                      planner may spend.
                    properties:
                      maxConcurrent:
                        default: 1
                        description: |-
                          maxConcurrent caps simultaneous moves. Each one holds a replication slot and adds
                          logical decoding load to its source.
                        format: int32
                        maximum: 16
                        minimum: 0
                        type: integer
                      maxPerWindow:
                        default: 4
                        description: |-
                          maxPerWindow caps how many moves may start inside one scheduling window, so a plan
                          that wants to move fifty tenants spends its budget over days rather than in an hour.
                        format: int32
                        maximum: 1000
                        minimum: 0
                        type: integer
                      windows:
                        description: |-
                          windows scope when moves may start. An empty list means any time, which is only a
                          sane default because an Online move queues clients rather than dropping them.
                        items:
                          description: TimeWindow is a recurring window expressed
                            as a cron start plus a duration.
                          properties:
                            duration:
                              description: duration is how long the window stays open
                                once started.
                              type: string
                            schedule:
                              description: schedule is a standard five-field cron
                                expression giving the window start.
                              maxLength: 256
                              type: string
                            timeZone:
                              default: UTC
                              description: timeZone is an IANA zone name. Defaults
                                to UTC.
                              maxLength: 64
                              type: string
                          required:
                          - duration
                          - schedule
                          type: object
                        maxItems: 32
                        type: array
                        x-kubernetes-list-type: atomic
                    type: object
                  minInstances:
                    description: minInstances is the floor on pool member count.
                    format: int32
                    maximum: 64
                    minimum: 1
                    type: integer
                  mode:
                    default: Recommend
                    description: mode selects whether plans are executed or only published
                      as Events and status.
                    enum:
                    - Recommend
                    - Auto
                    type: string
                  scaleInEvidenceWindow:
                    default: 168h
                    description: |-
                      scaleInEvidenceWindow is how much continuous per-tenant history must exist before an
                      instance may be removed. Scale-in is the one action that cannot be undone in seconds,
                      so it is gated on a week of evidence rather than on a stabilization window.
                    type: string
                  stabilizationWindow:
                    description: stabilizationWindow damps oscillation.
                    properties:
                      scaleDown:
                        default: 30m
                        description: scaleDown is how long a surplus must persist
                          before capacity is removed.
                        type: string
                      scaleUp:
                        default: 3m
                        description: scaleUp is how long a shortage must persist before
                          capacity is added.
                        type: string
                    type: object
                  staleMetricPolicy:
                    default: DoNothing
                    description: staleMetricPolicy is what happens once that threshold
                      is crossed.
                    enum:
                    - DoNothing
                    - ScaleToMinimum
                    type: string
                  staleMetricThreshold:
                    default: 5m
                    description: |-
                      staleMetricThreshold is how old the newest metering sample may be before the planner
                      treats the pool as unmeasured.
                    type: string
                  storage:
                    description: storage configures when a volume is grown.
                    properties:
                      expandAtPercent:
                        default: 80
                        description: expandAtPercent is the used-to-allocated ratio
                          that triggers an expansion.
                        format: int32
                        maximum: 99
                        minimum: 1
                        type: integer
                      expandToPercent:
                        default: 60
                        description: expandToPercent is the used-to-allocated ratio
                          the expansion aims to restore.
                        format: int32
                        maximum: 99
                        minimum: 1
                        type: integer
                      maxSize:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          maxSize caps how large a volume the planner may ask for, so a runaway table cannot
                          spend an unbounded amount of somebody's money.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    type: object
                  targetUtilizationPercent:
                    default: 70
                    description: |-
                      targetUtilizationPercent is the allocatable-connection utilization the planner steers
                      towards.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  tolerancePercent:
                    default: 10
                    description: |-
                      tolerancePercent is the HPA-shaped dead band. A utilization within this much of the
                      target proposes nothing at all, which is what stops a pool oscillating around a
                      boundary it is already close enough to.
                    format: int32
                    maximum: 50
                    minimum: 0
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: maxInstances must be greater than or equal to minInstances
                  rule: '!has(self.minInstances) || !has(self.maxInstances) || self.maxInstances
                    >= self.minInstances'
              capacity:
                description: capacity is the pool's budget and the denominator of
                  every guarantee.
                properties:
                  backendConnections:
                    description: |-
                      backendConnections is the pool-wide budget of tenant-usable backend connections.
                      It is the scale subresource's spec path. Admission rejects a value exceeding the sum
                      of the member instances' allocatable connections, which is itself derived from
                      max_connections minus superuser, replication and agent reserves.
                    format: int32
                    maximum: 100000
                    minimum: 1
                    type: integer
                  headroomPercent:
                    default: 25
                    description: |-
                      headroomPercent is withheld from the budget before guarantees are counted, so
                      allocatable = backendConnections * (1 - headroomPercent/100). Guarantees are admitted
                      against allocatable, never against the raw budget.
                    format: int32
                    maximum: 50
                    minimum: 0
                    type: integer
                  maxClientConnections:
                    description: |-
                      maxClientConnections caps client-side sockets across the proxy fleet. This is a
                      second, independent currency bounded by file descriptors rather than by
                      max_connections. In Session pool mode the two currencies collapse and admission
                      clamps each tenant's client limit to its burstable value.
                    format: int32
                    maximum: 1000000
                    minimum: 1
                    type: integer
                  maxOversubscriptionRatio:
                    default: "12"
                    description: |-
                      maxOversubscriptionRatio caps the sum of every tenant's burstable capacity divided by
                      allocatable. Oversubscription is the product, so this is a ceiling rather than a
                      prohibition; the observed ratio is published in status.
                    maxLength: 16
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                  storage:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      storage caps tenant data across the pool. It excludes WAL and temporary files, so a
                      pool can still exhaust its volumes while reporting storage headroom.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                required:
                - backendConnections
                type: object
              classRef:
                description: |-
                  classRef binds the pool to a cluster-scoped PgElasticClass. It is immutable because
                  the class fixes the capacity model, the extension allowlist and the collation
                  contract, all of which are baked into provisioned instances.
                properties:
                  apiGroup:
                    default: pgelastic.io
                    description: apiGroup of the referent. Always pgelastic.io.
                    maxLength: 253
                    type: string
                  kind:
                    description: kind of the referent.
                    maxLength: 63
                    type: string
                  name:
                    description: name of the referent.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: classRef is immutable
                  rule: self == oldSelf
                - message: classRef must reference a pgelastic.io PgElasticClass
                  rule: self.apiGroup == 'pgelastic.io' && self.kind == 'PgElasticClass'
              instances:
                description: instances declares the PostgreSQL instances pgelastic
                  provisions for this pool.
                properties:
                  replicas:
                    default: 3
                    description: |-
                      replicas is the number of PgInstance objects in the pool. Each one is itself an HA
                      group, so this is not a redundancy setting.
                    format: int32
                    maximum: 64
                    minimum: 1
                    type: integer
                  template:
                    description: template is the shape every member instance is provisioned
                      from.
                    properties:
                      backup:
                        description: backup configures physical backup and WAL archiving.
                        properties:
                          backupStandby:
                            default: true
                            description: |-
                              backupStandby takes the backup from a standby so the primary's connection budget and
                              I/O stay untouched. For a product selling connection guarantees this is the cheapest
                              large win available, which is why it defaults on.
                            type: boolean
                          objectStore:
                            description: |-
                              objectStore locates the repository. The stanza path underneath it is keyed on the
                              PostgreSQL system identifier rather than the instance name, so an instance recreated
                              under a reused name cannot interleave its WAL into a predecessor's archive.
                            properties:
                              credentialsSecretRef:
                                description: credentialsSecretRef names a Secret holding
                                  the object-store credentials.
                                properties:
                                  name:
                                    default: ""
                                    description: |-
                                      Name of the referent.
                                      This field is effectively required, but due to backwards compatibility is
                                      allowed to be empty. Instances of this type with an empty value here are
                                      almost certainly wrong.
                                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                    type: string
                                type: object
                                x-kubernetes-map-type: atomic
                              endpointURL:
                                description: endpointURL overrides the provider's
                                  default endpoint, for S3-compatible stores.
                                maxLength: 2048
                                type: string
                              path:
                                description: path is the destination URL, for example
                                  s3://bucket/prefix.
                                maxLength: 2048
                                minLength: 1
                                type: string
                              region:
                                description: region for providers that require one.
                                maxLength: 63
                                type: string
                            required:
                            - credentialsSecretRef
                            - path
                            type: object
                          retention:
                            default: {}
                            description: retention bounds full-backup and WAL history.
                            properties:
                              full:
                                default: 30d
                                description: full is how long full backups are kept.
                                pattern: ^[1-9][0-9]*[dwm]$
                                type: string
                              wal:
                                default: 30d
                                description: wal is how long archived WAL is kept.
                                  It may not be shorter than full.
                                pattern: ^[1-9][0-9]*[dwm]$
                                type: string
                            type: object
                          schedule:
                            default: 0 2 * * *
                            description: schedule is a five-field cron expression
                              for the full backup.
                            maxLength: 256
                            minLength: 1
                            type: string
                        required:
                        - objectStore
                        type: object
                      class:
                        description: |-
                          class names the CPU/memory/storage sizing class. It is what max_connections, and
                          therefore the pool's capacity ceiling, is derived from.
                        maxLength: 63
                        minLength: 1
                        type: string
                      highAvailability:
                        description: highAvailability configures the replication topology
                          of each member.
                        properties:
                          dataDurability:
                            default: Required
                            description: dataDurability selects stall-on-quorum-loss
                              versus degrade-to-async.
                            enum:
                            - Required
                            - Preferred
                            type: string
                          failoverDelay:
                            default: 10s
                            description: |-
                              failoverDelay debounces an unhealthy primary before an unplanned failover starts,
                              and is deliberately non-zero. A spurious failover costs a timeline bump, a rewind or
                              full re-clone, a window at 2/3 redundancy during which failover is impossible, and a
                              connection reset for every tenant on the instance. All of that is far more expensive
                              than ten extra seconds of downtime. The debounce origin is persisted in
                              status.currentPrimaryFailingSince so it survives an operator restart.
                            type: string
                          failoverQuorum:
                            default: true
                            description: |-
                              failoverQuorum gates automatic promotion on quorum evidence read out of the live
                              postmaster rather than out of this spec. Turning it off permits promoting a standby
                              that cannot be proven to hold the last acknowledged commit.
                            type: boolean
                          primaryLease:
                            default: {}
                            description: |-
                              primaryLease tunes the coordination.k8s.io Lease that provides mutual exclusion
                              between primaries.
                            properties:
                              leaseDuration:
                                default: 15s
                                description: |-
                                  leaseDuration is how long a lease stays valid without renewal. Take-over compares
                                  RenewTime for equality only, never ordering, so the previous holder's clock is never
                                  trusted.
                                type: string
                              releasedLeaseDuration:
                                default: 1s
                                description: |-
                                  releasedLeaseDuration is the short validity stamped on a lease released
                                  cooperatively, so a planned switchover does not wait out a full leaseDuration.
                                type: string
                              renewDeadline:
                                default: 10s
                                description: |-
                                  renewDeadline is how long the holder keeps trying to renew before treating the loss
                                  as terminal and stopping its postmaster.
                                type: string
                              retryPeriod:
                                default: 2s
                                description: |-
                                  retryPeriod is the interval between renewal and acquisition attempts. Per-attempt
                                  acquire timeout is leaseDuration + 3 * retryPeriod.
                                type: string
                            type: object
                            x-kubernetes-validations:
                            - message: leaseDuration must be greater than renewDeadline
                              rule: '!has(self.leaseDuration) || !has(self.renewDeadline)
                                || duration(self.leaseDuration) > duration(self.renewDeadline)'
                            - message: 5 * renewDeadline must be greater than 6 *
                                retryPeriod
                              rule: '!has(self.renewDeadline) || !has(self.retryPeriod)
                                || duration(self.renewDeadline).getMilliseconds()
                                * 5 > duration(self.retryPeriod).getMilliseconds()
                                * 6'
                          quorum:
                            default: ANY 1
                            description: |-
                              quorum is the leading clause of synchronous_standby_names, for example "ANY 1".
                              The member list is appended by the operator and rewritten using Patroni's ordering
                              rule: grow the quorum set before numsync, shrink numsync before the quorum set,
                              never both in one reload.
                            maxLength: 256
                            minLength: 1
                            type: string
                          replicas:
                            default: 3
                            description: |-
                              replicas is the total member count including the primary. Three is the only
                              topology the quorum gate is designed around: with quorum "ANY 1" the failover gate
                              R + W > N needs both standbys reachable.
                            format: int32
                            maximum: 5
                            minimum: 3
                            type: integer
                          switchoverTimeout:
                            default: 60s
                            description: switchoverTimeout bounds a planned, operator-initiated
                              role change end to end.
                            type: string
                          synchronousCommit:
                            default: "on"
                            description: synchronousCommit is applied instance-wide.
                            enum:
                            - "on"
                            - remote_apply
                            - remote_write
                            type: string
                        type: object
                      parameters:
                        additionalProperties:
                          description: |-
                            GUCValue is a PostgreSQL parameter value as written to custom.conf.

                            A line break is refused rather than escaped. postgresql.conf is line-oriented, so a value
                            carrying one stops being a value and becomes a directive of its own - which is how a
                            parameter nobody owns turns into `fsync = off`, past a denylist that matches by name.
                          maxLength: 1024
                          pattern: ^[^\n\r]*$
                          type: string
                        description: |-
                          parameters sets the user-settable subset of PostgreSQL GUCs. Operator-owned
                          parameters listed as fixed or blocked are rejected at admission and dropped again in
                          the config generator, so a stale object cannot poison a pod.
                        maxProperties: 64
                        type: object
                        x-kubernetes-validations:
