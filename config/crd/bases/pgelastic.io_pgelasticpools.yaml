                      that visible before it happens.
                    format: int32
                    type: integer
                  observedOversubscription:
                    description: observedOversubscription is committedBurst divided
                      by allocatable.
                    maxLength: 16
                    type: string
                  reserved:
                    description: reserved is the sum of guaranteed capacity over bound
                      tenants.
                    format: int32
                    type: integer
                type: object
              conditions:
                description: conditions represent the current state of the PgElasticPool
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the spec generation the rest of
                  this status describes.
                format: int64
                type: integer
              perInstance:
                description: perInstance is the ledger broken down by member instance.
                items:
                  description: |-
                    PoolInstanceStatus is one member instance's contribution to the ledger. This breakdown
                    is mandatory rather than decorative: pool accounting is not additive across instances,
                    because a tenant's guarantee is only satisfiable on the instance it is bound to.
                  properties:
                    allocatable:
                      description: allocatable connections on this instance.
                      format: int32
                      type: integer
                    inUse:
                      description: inUse is the live backend connection count on this
                        instance.
                      format: int32
                      type: integer
                    name:
                      description: name of the PgInstance.
                      maxLength: 253
                      type: string
                    ready:
                      description: |-
                        ready reports whether the instance can accept tenant traffic. An instance re-cloning a
                        replica reports not ready, and its headroom must not be counted as available.
                      type: boolean
                    reserved:
                      description: reserved is the sum of guarantees for tenants bound
                        to this instance.
                      format: int32
                      type: integer
                    role:
                      description: role of the instance's current primary member.
                      enum:
                      - primary
                      - replica
                      - unknown
                      type: string
                    tenants:
                      description: tenants bound to this instance.
                      format: int32
                      type: integer
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              phase:
                default: Pending
                description: |-
                  phase is a display-only summary for kubectl get. It is a pure function of the
                  conditions; automation must read the conditions instead.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Degraded
                - Paused
                - Terminating
                type: string
              proxy:
                description: proxy is the observed state of the proxy fleet.
                properties:
                  configVersion:
                    description: |-
                      configVersion identifies the configuration the fleet has converged on, so a partial
                      rollout is distinguishable from a converged one.
                    maxLength: 64
                    type: string
                  leasedConnections:
                    description: |-
                      leasedConnections is the total backend-connection credit the fleet holds: replicas
                      multiplied by the per-replica budget. It is the failure mode no single-process pooler
                      can see, and until per-replica leases exist it is a static grant rather than a lease —
                      which is why it can exceed allocatable, and why admission bounds the worst case
                      instead.
                    format: int32
                    type: integer
                  ready:
                    description: ready is the number of proxy pods serving.
                    format: int32
                    type: integer
                  replicas:
                    description: replicas is the desired proxy pod count.
                    format: int32
                    type: integer
                type: object
              selector:
                description: |-
                  selector is the label selector matching the proxy pods, in the form required by the
                  scale subresource so that HPA and KEDA can target this object with no new API.
                maxLength: 1024
                type: string
              tenants:
                description: tenants summarises the pool's tenant population.
                properties:
                  bound:
                    description: bound tenants, meaning placed on an instance with
                      a database provisioned.
                    format: int32
                    type: integer
                  byQosClass:
                    description: byQosClass breaks the population down by derived
                      QoS class.
                    properties:
                      bestEffort:
                        description: bestEffort counts tenants with no guarantee.
                        format: int32
                        type: integer
                      burstable:
                        description: burstable counts tenants with a non-zero guarantee
                          below their burstable.
                        format: int32
                        type: integer
                      guaranteed:
                        description: guaranteed counts tenants whose guaranteed equals
                          their burstable.
                        format: int32
                        type: integer
                    type: object
                  pending:
                    description: pending tenants awaiting placement.
                    format: int32
                    type: integer
                  quarantined:
                    description: quarantined tenants still inside their observation
                      window.
                    format: int32
                    type: integer
                  throttledLast24h:
                    description: throttledLast24h counts tenants that hit any admission
                      limit in the last day.
                    format: int32
                    type: integer
                  total:
                    description: total tenants referencing this pool.
                    format: int32
                    type: integer
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      scale:
        labelSelectorPath: .status.selector
        specReplicasPath: .spec.capacity.backendConnections
        statusReplicasPath: .status.capacity.backendConnections
      status: {}
