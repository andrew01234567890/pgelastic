---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: pgrestores.pgelastic.io
spec:
  group: pgelastic.io
  names:
    categories:
    - pgelastic
    kind: PgRestore
    listKind: PgRestoreList
    plural: pgrestores
    shortNames:
    - pgr
    singular: pgrestore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sourceInstanceRef.name
      name: Source
      type: string
    - jsonPath: .status.targetInstance
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PgRestore puts an instance back, into a new instance, at a moment of the operator's
          choosing.

          Recovery is never performed in place. The instance being recovered from is very often the
          only copy of the data, and a restore that ran over it would destroy the thing it was
          asked to save the moment it went wrong. The new instance is created unschedulable and
          joins no pool until somebody says so: a restored instance is evidence until it has been
          looked at, not capacity.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PgRestore
            properties:
              backupRef:
                description: |-
                  backupRef names the base backup to start from. Required unless the target is a time
                  or an LSN.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              scope:
                default: Instance
                description: scope is what is being restored.
                enum:
                - Instance
                type: string
              sourceInstanceRef:
                description: |-
                  sourceInstanceRef names the instance whose repository is being read.

                  The instance itself need not still exist. What is read from it when it does is its
                  repository and its sizing; when it does not, backupRef supplies both, which is why a
                  backup's status records them.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              target:
                description: target is where recovery stops. Omitted means replay
                  everything the archive holds.
                properties:
                  exclusive:
                    description: |-
                      exclusive stops just before the named target rather than just after it. It has no
                      meaning for immediate.
                    type: boolean
                  immediate:
                    description: |-
                      immediate stops recovery as soon as the backup is consistent, without replaying any
                      further. It is the fastest restore and it lands at whatever moment the backup ended.
                    type: boolean
                  lsn:
                    description: lsn stops recovery at a write-ahead log position.
                    maxLength: 64
                    type: string
                  name:
                    description: |-
                      name stops recovery at a restore point created with pg_create_restore_point.

                      PostgreSQL enforces MAXFNAMELEN on both ends, so a longer name is refused here rather
                      than silently truncated into one that matches nothing.
                    maxLength: 63
                    pattern: ^[^\x00-\x1f\x7f]*$
                    type: string
                  time:
                    description: |-
                      time stops recovery at the first transaction that committed after this moment.

                      A timestamp with no zone is read as UTC. Recovery fails outright if no transaction
                      committed after it, which is a surprising way to learn that the target is in the
                      future.
                    maxLength: 64
                    type: string
                  timeline:
                    description: |-
                      timeline selects which history to follow, "latest" or a positive integer.

                      It is not mutually exclusive with the rest: a target time can fall on more than one
                      timeline once an instance has been restored before, and picking the wrong one lands
                      on a history that diverged before the moment asked for.
                    maxLength: 16
                    pattern: ^(latest|[1-9][0-9]*)$
                    type: string
                  xid:
                    description: |-
                      xid stops recovery at a transaction id.

                      PostgreSQL casts this to TransactionId, which is 32 bits: a larger value would be
                      silently truncated into a different transaction, so the pattern refuses one outright.
                    maxLength: 10
                    pattern: ^[0-9]+$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: at most one of time, lsn, name, xid or immediate may be
                    set
                  rule: '[has(self.time), has(self.lsn), has(self.name), has(self.xid),
                    has(self.immediate)].filter(x, x).size() <= 1'
              targetInstanceName:
                description: |-
                  targetInstanceName is the instance to create. Defaults to the restore's own name.

                  It is always a new instance: restoring in place would destroy the only copy of the
                  thing being recovered, and a restore that went wrong would leave nothing to try again
                  from.
                maxLength: 253
                type: string
            required:
            - sourceInstanceRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
            - message: backupRef is required unless the target is a time or an LSN,
                because nothing else can be searched for in the repository catalogue
              rule: has(self.backupRef) || !has(self.target) || has(self.target.time)
                || has(self.target.lsn)
          status:
            description: status defines the observed state of PgRestore
            properties:
              backupID:
                description: |-
                  backupID is the base backup recovery actually started from, which for a
                  time-targeted restore is chosen from the catalogue rather than named in the spec.
                maxLength: 128
                type: string
              conditions:
                description: conditions carry the real state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              error:
                description: error is why it failed, when it did.
                maxLength: 1024
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation these conditions
                  describe.
                format: int64
                type: integer
              phase:
                description: phase is display only and carries no semantics of its
                  own.
                enum:
                - Preflight
                - Recovering
                - Completed
                - Failed
                type: string
              targetInstance:
                description: targetInstance is the instance that was created.
                maxLength: 253
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
