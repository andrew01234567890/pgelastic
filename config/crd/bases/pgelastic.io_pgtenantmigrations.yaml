---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: pgtenantmigrations.pgelastic.io
spec:
  group: pgelastic.io
  names:
    categories:
    - pgelastic
    kind: PgTenantMigration
    listKind: PgTenantMigrationList
    plural: pgtenantmigrations
    shortNames:
    - pgtm
    singular: pgtenantmigration
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenantRef.name
      name: Tenant
      type: string
    - jsonPath: .spec.targetInstanceRef.name
      name: Target
      type: string
    - jsonPath: .spec.strategy
      name: Strategy
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.lagBytes
      name: Lag
      type: integer
    - jsonPath: .status.pauseDurationMillis
      name: Pause
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PgTenantMigration is one non-repeatable move of a single tenant from the instance it
          is bound to onto another instance in the same pool.

          The phase machine advances Preflight -> Provisioning -> PreWarm -> Copying -> Catchup
          -> Quiescing -> Cutover -> Completed. Every phase may leave for Failed on error or
          Aborted on request; Completed may leave for RolledBack until rollbackDeadline passes,
          after which the migration is final.

          Every departure from the happy path leaves the tenant serving from the SOURCE. The
          routing table is flipped exactly once, at the end of Cutover, after verification has
          passed; before that point an abort only has to run the cleanup ladder (disable the
          subscription, detach its slot, drop the subscription, drop the slot, drop the
          publication) and release the quiesce, and after that point a rollback flips routing
          back to a source database that has been kept intact for precisely this reason.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PgTenantMigration
            properties:
              approvedBy:
                description: |-
                  approvedBy records the human who authorized this move. Required for tenants whose
                  PgWorkloadClass sets migration.requireApproval; the admission webhook rejects the
                  object when it is absent.
                maxLength: 253
                minLength: 1
                type: string
              cutoverTimeout:
                default: 1m0s
                description: |-
                  cutoverTimeout bounds the whole Cutover phase, including the final LSN wait,
                  sequence handling and verification. Exceeding it aborts back to the source, so it
                  is the upper bound on the pause clients can observe.
                type: string
              drainTimeout:
                default: 30s
                description: |-
                  drainTimeout bounds how long Quiescing waits for in-flight transactions to finish
                  before the migration aborts back to the source.

                  Every default on this type is spelled in Go's canonical duration form, and has to be:
                  the spec is immutable by CEL, and a metav1.Duration serializes back out as
                  time.Duration.String(). A default of "1h" would be stored verbatim at creation and
                  re-serialized as "1h0m0s" on the next write, so the immutability rule would reject
                  every subsequent update to the object - including adding a finalizer or an annotation.
                type: string
              preflight:
                description: preflight tunes the blocking gate run before anything
                  is provisioned.
                properties:
                  forbidLargeObjects:
                    default: true
                    description: |-
                      forbidLargeObjects fails the migration when the tenant holds any pg_largeobject
                      entry, which logical replication does not carry.
                    type: boolean
                  forbidMoveWhenSourceUtilizationAbovePercent:
                    default: 65
                    description: |-
                      forbidMoveWhenSourceUtilizationAbovePercent refuses to start while the source
                      instance is this busy, independently of how cold the tenant itself is.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  forbidPreparedTransactions:
                    default: true
                    description: |-
                      forbidPreparedTransactions fails the migration while any prepared transaction is
                      open on the tenant's database: it pins the source's oldest xmin and can neither be
                      replicated nor drained.
                    type: boolean
                  maxSourceLagBytes:
                    description: |-
                      maxSourceLagBytes is the replication lag under which Catchup may advance to
                      Quiescing. Leave unset to require the subscription to be fully caught up, which
                      trades a longer Catchup for the shortest possible pause.
                    format: int64
                    minimum: 0
                    type: integer
                  requireColdTenant:
                    default: true
                    description: |-
                      requireColdTenant refuses to move a tenant whose observed utilization is above the
                      pool's hot threshold. Moving a hot tenant consumes exactly the resource that is
                      already scarce on the source.
                    type: boolean
                  requireReplicaIdentity:
                    default: true
                    description: |-
                      requireReplicaIdentity fails the migration unless every table carries a PRIMARY KEY
                      or an explicit REPLICA IDENTITY. Without one, logical replication silently drops
                      UPDATE and DELETE rows on the target.
                    type: boolean
                type: object
              rollbackWindow:
                default: 1h0m0s
                description: |-
                  rollbackWindow is how long the source database is kept intact and
                  connection-refusing after a successful cutover, during which routing can be flipped
                  back without restoring a backup. It is dropped once the window closes.
                type: string
              sequenceHandling:
                description: sequenceHandling controls how sequences are carried across
                  at cutover.
                properties:
                  mode:
                    default: SetvalWithGap
                    description: mode selects whether sequences are advanced at cutover.
                    enum:
                    - SetvalWithGap
                    - Skip
                    type: string
                  safetyGap:
                    default: 1000
                    description: |-
                      safetyGap is added to each source sequence's last value before it is applied to the
                      target, covering values cached in source backends that were never written to WAL.
                      It must exceed the largest CACHE setting the tenant uses.
                    format: int64
                    minimum: 0
                    type: integer
                type: object
              strategy:
                default: Auto
                description: strategy selects the data movement mechanism.
                enum:
                - Auto
                - Online
                - Offline
                type: string
              targetInstanceRef:
                description: |-
                  targetInstanceRef names the destination PgInstance, in this namespace. It must
                  belong to the tenant's pool and present a byte-identical collation contract.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              tenantRef:
                description: tenantRef names the PgTenant being moved, in this namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            required:
            - targetInstanceRef
            - tenantRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: status defines the observed state of PgTenantMigration
            properties:
              completedAt:
                description: completedAt is when the migration reached a terminal
                  phase.
                format: date-time
                type: string
              conditions:
                description: conditions represent the current state of the PgTenantMigration
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              copiedTables:
                description: copiedTables counts relations whose initial sync has
                  finished.
                format: int32
                minimum: 0
                type: integer
              lagBytes:
                description: |-
                  lagBytes is the source WAL distance between the slot's confirmed_flush_lsn and the
                  primary's current LSN.
                format: int64
                type: integer
              observedGeneration:
                description: observedGeneration is the .metadata.generation this status
                  was computed from.
                format: int64
                type: integer
              pauseDurationMillis:
                description: |-
                  pauseDurationMillis is how long clients were queued across Quiescing and Cutover.
                  It is also exported as a Prometheus histogram; the target is a p99 below one second
                  with clients queued and never dropped. Dropping connections and relying on client
                  retry is what the comparable managed-service elastic pool move does, so this number
                  is a product commitment rather than a diagnostic.
                format: int64
                minimum: 0
                type: integer
              phase:
                default: Preflight
                description: phase is a display-only pure function of the conditions.
                enum:
                - Preflight
                - Provisioning
                - PreWarm
                - Copying
                - Catchup
                - Quiescing
                - Cutover
                - Completed
                - Failed
                - Aborted
                - RolledBack
                type: string
              publicationName:
                description: publicationName is the publication created on the source.
                maxLength: 63
                type: string
              replicationSlotName:
                description: |-
                  replicationSlotName is the source slot backing the subscription. Recorded so the
                  cleanup ladder and the orphan sweeper can reap it by name after the subscription
                  object is gone; an abandoned slot otherwise pins the source primary's WAL.
                maxLength: 63
                type: string
              rollbackDeadline:
                description: |-
                  rollbackDeadline is when the source database stops being recoverable and is
                  dropped. Empty before a successful cutover.
                format: date-time
                type: string
              sourceInstanceRef:
                description: |-
                  sourceInstanceRef is resolved once at Preflight and then treated as fixed, so an
                  abort has an unambiguous instance to leave the tenant serving from even if the
                  tenant's binding is concurrently rewritten.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              startedAt:
                description: startedAt is when the controller began Preflight.
                format: date-time
                type: string
              subscriptionName:
                description: subscriptionName is the subscription created on the target.
                maxLength: 63
                type: string
              totalTables:
                description: totalTables is the relation count preflight found on
                  the source.
                format: int32
                minimum: 0
                type: integer
              verification:
                description: verification is the equivalence evidence gathered before
                  the routing flip.
                properties:
                  checksumsMatch:
                    description: |-
                      checksumsMatch reports whether the sampled content checksums agree. Unset when the
                      migration did not run content verification.
                    type: boolean
                  rowCountsMatch:
                    description: rowCountsMatch reports whether per-relation row counts
                      agree.
                    type: boolean
                  schemaFingerprintMatch:
                    description: schemaFingerprintMatch reports whether the ordered
                      catalog digests agree.
                    type: boolean
                  verifiedAt:
                    description: verifiedAt is when the last check completed.
                    format: date-time
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
